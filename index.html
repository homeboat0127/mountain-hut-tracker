<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百岳山屋查詢</title>
<style>
  body { font-family: -apple-system, "PingFang TC", sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 4px; }
  .updated { color: #888; font-size: 13px; margin-bottom: 16px; }

  .hut-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .hut-tab { padding: 6px 14px; border-radius: 16px; border: 1px solid #ddd; background: #fff; font-size: 13px; cursor: pointer; color: #333; }
  .hut-tab.active { background: #222; color: #fff; border-color: #222; }

  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekday-header { text-align: center; font-size: 13px; font-weight: 600; color: #666; padding-bottom: 6px; }

  .day-cell { border: 1px solid #eee; border-radius: 6px; min-height: 96px; padding: 6px; font-size: 11px; }
  .day-cell.empty { background: #fafafa; border: none; }
  .day-cell.no-data { color: #bbb; }
  .day-num { font-size: 13px; font-weight: 600; margin-bottom: 4px; }

  .status { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; margin-bottom: 4px; }
  .status.full { background: #fdecea; color: #c0392b; }
  .status.avail { background: #eafaf1; color: #1e8449; }

  .day-cell .line { color: #555; line-height: 1.6; }

  .legend { margin-top: 24px; font-size: 12px; color: #888; line-height: 1.8; }

  @media (max-width: 640px) {
    .day-cell { min-height: 76px; font-size: 10px; }
  }
</style>
</head>
<body>
  <h1>百岳山屋查詢</h1>
  <div class="updated" id="updated"></div>

  <div class="hut-tabs" id="hut-tabs"></div>

  <div class="sub" id="hut-title"></div>
  <div class="calendar" id="calendar"></div>

  <div class="legend">
    餘額：剩餘床位或營位名額｜排隊預約：等候抽籤或遞補｜審核中：已核發名額尚未完成手續｜核准入園：已核准，可上網列印入園許可證
  </div>

  <script>
    const weekdayHeaders = ['一', '二', '三', '四', '五', '六', '日'];
    let currentData = null;

    function renderHut(index) {
      const hut = currentData.huts[index];
      const { year, month } = currentData;

      document.querySelectorAll('.hut-tab').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      document.getElementById('hut-title').textContent =
        `${hut.mountain}．${hut.name}（平日床位 ${hut.capacity_weekday_bed}／假日床位 ${hut.capacity_weekend_bed}）`;

      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';

      weekdayHeaders.forEach(w => {
        const h = document.createElement('div');
        h.className = 'weekday-header';
        h.textContent = w;
        calendar.appendChild(h);
      });

      const dayMap = {};
      hut.days.forEach(d => { dayMap[d.date] = d; });

      const firstDate = new Date(year, month - 1, 1);
      const lastDate = new Date(year, month, 0);
      const lastDay = lastDate.getDate();
      const firstWeekdayMon0 = (firstDate.getDay() + 6) % 7;

      for (let i = 0; i < firstWeekdayMon0; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        calendar.appendChild(empty);
      }

      for (let d = 1; d <= lastDay; d++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const day = dayMap[dateStr];
        const cell = document.createElement('div');

        if (!day) {
          cell.className = 'day-cell no-data';
          cell.innerHTML = `<div class="day-num">${d}</div>`;
        } else {
          const isFull = day.status === '額滿';
          const statusClass = isFull ? 'full' : 'avail';
          const statusText = isFull ? '額滿' : `餘額 ${day.bed_avail}床／${day.tent_avail}帳`;
          cell.className = 'day-cell';
          cell.innerHTML = `
            <div class="day-num">${d}</div>
            <span class="status ${statusClass}">${statusText}</span>
            <div class="line">排隊 ${day.queue ?? '—'}</div>
            <div class="line">審核 ${day.reviewing ?? '—'}</div>
            <div class="line">入園 ${day.approved ?? '—'}</div>
          `;
        }
        calendar.appendChild(cell);
      }
    }

    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        currentData = data;
        document.getElementById('updated').textContent = '資料更新時間：' + data.updated_at;

        const tabs = document.getElementById('hut-tabs');
        data.huts.forEach((hut, i) => {
          const btn = document.createElement('div');
          btn.className = 'hut-tab';
          btn.textContent = hut.name;
          btn.addEventListener('click', () => renderHut(i));
          tabs.appendChild(btn);
        });

        renderHut(0);
      });
  </script>
</body>
</html>
