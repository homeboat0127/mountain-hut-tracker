name: 更新山屋資料

on:
  schedule:
    # UTC 時間，對應台灣時間 07:00 / 11:00 / 15:00 / 19:00
    - cron: '0 23,3,7,11 * * *'
  workflow_dispatch:        # 也可以在 GitHub 網頁上手動按按鈕執行

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 執行爬蟲
        run: python scrape.py

      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data.json summary.json search-index.json health.json)" ]; then
            echo "資料無變動，略過提交"
            exit 0
          fi
          git add data.json summary.json search-index.json health.json
          git commit -m "自動更新山屋資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 爬蟲執行期間若有人推了其他修改，直接推會被拒絕。
          # 這裡先 rebase 再推，並重試數次，避免整批資料因為時間碰撞而白跑。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（第 $i 次），同步遠端後重試…"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "重試多次仍失敗"
          exit 1

      - name: 檢查是否有系統資料異常
        # 放在提交之後：資料照常更新，但若有機關的頁面回傳空資料，
        # 仍要讓這次執行標記為失敗，才會收到通知去查。
        # 順序不能顛倒 —— 先失敗就不會提交，等於又回到「一個機關拖垮全部」。
        run: |
          python3 - <<'PY'
          import json, sys
          with open("data.json", encoding="utf-8") as f:
              d = json.load(f)
          stale = d.get("stale_systems") or {}
          if stale:
              print("以下系統的官方頁面回傳空資料，本站已保留前一次成功抓取的內容：")
              for k, v in stale.items():
                  print(f"  - {k}：自 {v.get('since')} 起未更新（{v.get('reason')}）")
              sys.exit(1)
          print("所有系統資料正常")
          PY
