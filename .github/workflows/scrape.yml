name: 更新山屋資料

on:
  schedule:
    # UTC 時間，對應台灣時間 07:00 / 11:00 / 15:00 / 19:00
    - cron: '0 23,3,7,11 * * *'
  workflow_dispatch:        # 也可以在 GitHub 網頁上手動按按鈕執行

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 執行爬蟲
        run: python scrape.py

      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data.json summary.json search-index.json health.json)" ]; then
            echo "資料無變動，略過提交"
            exit 0
          fi
          git add data.json summary.json search-index.json health.json
          git commit -m "自動更新山屋資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 爬蟲執行期間若有人推了其他修改，直接推會被拒絕。
          # 這裡先 rebase 再推，並重試數次，避免整批資料因為時間碰撞而白跑。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（第 $i 次），同步遠端後重試…"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "重試多次仍失敗"
          exit 1
